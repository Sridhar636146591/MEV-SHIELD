services:
  # ── Backend API (Node.js / Express) ────────────────────────────────────────
  - type: web
    name: mev-shield-api
    runtime: node
    region: singapore          # closest to India
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NETWORK
        value: sepolia
      # ── Supabase / PostgreSQL ──────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false            # set manually in Render dashboard (Supabase connection string)
      - key: DIRECT_URL
        sync: false            # Supabase direct connection (for Prisma migrations)
      # ── API Keys (set in Render dashboard) ────────────────────────────────
      - key: ALCHEMY_API_KEY
        sync: false
      - key: ALCHEMY_ENDPOINT_MAINNET
        value: https://eth-mainnet.g.alchemy.com/v2/
      - key: ALCHEMY_ENDPOINT_SEPOLIA
        value: https://eth-sepolia.g.alchemy.com/v2/
      - key: COINMARKETCAP_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FLASHBOTS_RELAY_URL
        value: https://relay.flashbots.net
      - key: FLASHBOTS_PROTECT_RPC
        value: https://rpc.flashbots.net

  # ── Frontend (React Static Site) ───────────────────────────────────────────
  - type: web
    name: mev-shield-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: mev-detector
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false            # set to your Render backend URL e.g. https://mev-shield-api.onrender.com
      - key: REACT_APP_NETWORK
        value: sepolia
      - key: CI
        value: "false"
